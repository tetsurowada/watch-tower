<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5165"/>
      <stop offset="1" stop-color="#132833"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cf6a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f6cf6a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6f7"/>
      <stop offset="1" stop-color="#d5dee2"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <!-- macOS icon grid: 824 body inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  <!-- beam -->
  <path d="M560 338 L924 226 L924 486 Z" fill="url(#beam)" clip-path="url(#body)"/>
  <!-- legs -->
  <path d="M452 392 H572 L632 790 H392 Z" fill="url(#stone)"/>
  <path d="M430 540 H594 M410 672 H614" stroke="#1d3a48" stroke-width="16" stroke-linecap="butt"/>
  <!-- cabin and roof -->
  <rect x="414" y="300" width="196" height="96" rx="10" fill="url(#stone)"/>
  <path d="M396 304 L512 222 L628 304 Z" fill="#f3f6f7"/>
  <rect x="456" y="320" width="112" height="56" rx="8" fill="#f2c45a"/>
  <!-- base -->
  <rect x="330" y="786" width="364" height="34" rx="17" fill="#f3f6f7"/>
</svg>
